extensions:
  healthcheckv2:
    use_v2: true
    component_health:
      include_permanent_errors: false
      include_recoverable_errors: true
      recovery_duration: 5m
    http:
      endpoint: 0.0.0.0:13133
      status:
        enabled: true
        path: /
        include_attributes: true
    grpc:
      endpoint: 0.0.0.0:13132
      transport: tcp
  pprof:
    endpoint: 127.0.0.1:1777
  zpages:
    endpoint: 0.0.0.0:55679

  # multitudes_auth extracts the Bearer token from each incoming OTLP request's
  # Authorization header and passes it through the pipeline. Clients configure:
  #   OTEL_EXPORTER_OTLP_HEADERS=Authorization=Bearer <api-key>
  # If a client sends no Authorization header, the exporter falls back to
  # MULTITUDES_INTEGRATION_TOKEN (backward-compatible central-token mode).
  multitudes_auth:

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: multitudes_auth
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: multitudes_auth

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 256

  aggregation:
    attribute_key: "user.email"        # Group by user email
    aggregation_interval: 5m
    emit_interval: 1m

  # multitudes_logs injects the per-client Bearer token (extracted by
  # multitudes_auth) into each ResourceLogs resource attribute so it
  # survives through the batch processor to the exporter.
  multitudes_logs:

  # Batch processor - flushes completed buckets promptly
  batch:
    timeout: 5m
    send_batch_size: 20000      # Send early if batch reaches 20k metrics (safety valve)
    send_batch_max_size: 25000  # Hard limit

exporters:
  multitudes:
    endpoint: ${env:MULTITUDES_INTEGRATION_ENDPOINT}
    fallback_token: ${env:MULTITUDES_INTEGRATION_TOKEN}
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  extensions: [healthcheckv2, pprof, zpages, multitudes_auth]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, aggregation, batch]
      exporters: [multitudes]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, multitudes_logs, batch]
      exporters: [multitudes]
