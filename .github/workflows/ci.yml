name: CI

on:
  push:
    branches:
      - prod
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. test, v1.2.0-beta.1, my-feature)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - aggregationprocessor
          - multitudesauthextension
          - multitudesexporter
          - multitudeslogsprocessor
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.component }}/go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/prod' || github.event_name == 'workflow_dispatch'
    outputs:
      version: ${{ steps.version.outputs.value }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read VERSION file
        id: version
        run: echo "value=$(cat VERSION)" >> $GITHUB_OUTPUT

      # Fail before anything is published if prod has a malformed version.
      - name: Validate VERSION
        if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION '$VERSION' is not in MAJOR.MINOR.PATCH form"
            exit 1
          fi

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,enable=${{ github.event_name != 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/prod' && github.event_name != 'workflow_dispatch' }}
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ github.ref == 'refs/heads/prod' && github.event_name != 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Create the git tag and GitHub release for the version in the VERSION file.
  # Runs only for pushes to prod, after the image has been pushed. A separate job
  # so that only this job has write access to the repository contents. It does
  # nothing if the release already exists, so merges that leave VERSION unchanged
  # (docs, CI, etc.) and re-runs are safe.
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Create git tag and GitHub release
        uses: actions/github-script@v9
        env:
          VERSION: ${{ needs.docker.outputs.version }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = `v${process.env.VERSION}`;

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release ${tag} already exists, skipping`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            // GitHub ignores target_commitish when the tag already exists, so a
            // leftover tag pointing at another commit would make the release
            // describe different code from the image this run published.
            let tagCommit;
            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              tagCommit = ref.data.object.sha;
              if (ref.data.object.type === 'tag') {
                const annotated = await github.rest.git.getTag({ owner, repo, tag_sha: tagCommit });
                tagCommit = annotated.data.object.sha;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (tagCommit && tagCommit !== context.sha) {
              core.setFailed(
                `Tag ${tag} already exists at ${tagCommit}, but this run published ${context.sha}. ` +
                  'Move or delete the tag, or create the release manually.'
              );
              return;
            }

            // Uses the existing tag if there is one, otherwise creates it at this commit.
            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              generate_release_notes: true,
            });
            core.info(`Created release ${tag}`);
