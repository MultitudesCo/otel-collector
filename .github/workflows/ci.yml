name: CI

on:
  push:
    branches:
      - prod
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. test, v1.2.0-beta.1, my-feature)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - aggregationprocessor
          - multitudesauthextension
          - multitudesexporter
          - multitudeslogsprocessor
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.component }}/go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/prod' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read VERSION file
        id: version
        run: echo "value=$(cat VERSION)" >> $GITHUB_OUTPUT

      # Fail before anything is published if prod has a malformed version.
      - name: Validate VERSION
        if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION '$VERSION' is not in MAJOR.MINOR.PATCH form"
            exit 1
          fi

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,enable=${{ github.event_name != 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/prod' && github.event_name != 'workflow_dispatch' }}
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ github.ref == 'refs/heads/prod' && github.event_name != 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Create the git tag and GitHub release for the version in the VERSION file.
  # Runs only for pushes to prod, after the image has been pushed. A separate job
  # so that only this job has write access to the repository contents. It does
  # nothing if the release already exists, so merges that leave VERSION unchanged
  # (docs, CI, etc.) and re-runs are safe.
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create git tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(cat VERSION)"
          if out=$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" 2>&1); then
            echo "Release ${tag} already exists, skipping"
          elif echo "${out}" | grep -qi 'release not found'; then
            # Uses the existing tag if there is one, otherwise creates it at this commit.
            gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "${tag}" --generate-notes
            echo "Created release ${tag}"
          else
            echo "::error::Could not check for release ${tag}: ${out}"
            exit 1
          fi
